<div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-300">
    <div
        class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-[32px] shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh] animate-in zoom-in-95 slide-in-from-bottom-12 duration-500 overflow-hidden">
        <!-- Header -->
        <div class="px-8 py-7 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
            <div>
                <h3 class="text-xl font-black tracking-tight text-slate-900 dark:text-slate-50">Create New Project Task</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Assign work to your site team</p>
            </div>
            <button (click)="close.emit()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-all group active:scale-95 cursor-pointer">
                <span class="material-symbols-outlined text-slate-400 group-hover:text-slate-900 transition-colors">close</span>
            </button>
        </div>

        <!-- Scrollable Form Area -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-8 py-8 space-y-8 bg-white dark:bg-slate-900">
            <!-- Title -->
            <div class="group space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 group-focus-within:text-blue-600 transition-colors">Task Title</label>
                <div class="relative">
                    <input [(ngModel)]="task.title" placeholder="e.g., Foundation Rebar Installation" type="text"
                        class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-transparent rounded-[20px] p-5 text-sm font-bold text-slate-900 dark:text-slate-50 focus:bg-white dark:focus:bg-slate-900 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all shadow-inner" />
                    <span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none">assignment</span>
                </div>
            </div>

            <!-- Due Date & Priority Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Due Date -->
                <div class="group space-y-2">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Target Date</label>
                    <div class="relative">
                        <input type="date" [(ngModel)]="task.date"
                            class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-transparent rounded-2xl p-4 text-sm font-bold text-slate-900 dark:text-slate-50 focus:bg-white focus:border-blue-500 outline-none transition-all shadow-inner">
                        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none">calendar_today</span>
                    </div>
                </div>

                <!-- Priority -->
                <div class="group space-y-2">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Priority Level</label>
                    <div class="relative">
                        <select [(ngModel)]="task.priority"
                            class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-transparent rounded-2xl p-4 text-sm font-bold text-slate-900 dark:text-slate-50 focus:bg-white focus:border-blue-500 outline-none transition-all shadow-inner appearance-none cursor-pointer">
                            <option *ngFor="let p of priorities" [value]="p.label">{{ p.label }}</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none">signal_cellular_alt</span>
                    </div>
                </div>
            </div>

            <!-- Assignee Selection -->
            <div class="group space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Assign To Site Personal</label>
                <div class="relative">
                    <select (change)="onAssigneeSelect($event)"
                        class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-transparent rounded-2xl p-4 text-sm font-bold text-slate-900 dark:text-slate-50 focus:bg-white focus:border-blue-500 outline-none transition-all shadow-inner appearance-none cursor-pointer">
                        <option disabled [selected]="!task.assigneeId">Select Team Member</option>
                        @for (member of teamMembers; track member.id) {
                        <option [value]="member.id">{{ member.firstname }} {{ member.lastname }} ({{ member.role }})</option>
                        }
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">group</span>
                </div>
            </div>

            <!-- Initial Status (Read Only) -->
            <div class="group space-y-2 opacity-80">
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Board Placement</label>
                <div class="flex items-center gap-3 bg-slate-100 dark:bg-slate-800/50 rounded-2xl p-4 border border-dashed border-slate-200 dark:border-slate-700">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                    <span class="text-sm font-bold text-slate-600 dark:text-slate-400">{{ task.status }}</span>
                </div>
            </div>

            <!-- Description -->
            <div class="group space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Task Scope & Details</label>
                <textarea [(ngModel)]="task.description" rows="5"
                    placeholder="Provide specific instructions, dimensions, or material requirements for the field crew..."
                    class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-transparent rounded-[24px] p-5 text-sm font-medium text-slate-700 dark:text-slate-300 focus:bg-white focus:border-blue-500 outline-none transition-all shadow-inner resize-none"></textarea>
            </div>
        </div>

        <!-- Actions -->
        <div
            class="px-8 py-6 bg-surface-container-low/50 border-t border-outline-variant/10 flex items-center justify-end gap-4">
            <button (click)="close.emit()"
                class="px-6 py-2.5 text-sm font-bold text-outline hover:text-on-surface transition-colors cursor-pointer">
                Cancel
            </button>
            <button (click)="onSubmit()" [disabled]="!task.title.trim()"
                class="px-8 py-3 bg-gradient-to-br from-primary to-primary-container text-white text-sm font-bold rounded-2xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50 disabled:grayscale disabled:scale-100 cursor-pointer">
                Initialize Task
            </button>
        </div>
    </div>
</div>
