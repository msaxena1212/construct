<div class="timeline-card">

  <div class="timeline-toolbar">

    <button
      class="view-btn"
      [class.active]="currentView === 'Day'"
      (click)="changeView('Day')">
      Day
    </button>

    <button
      class="view-btn"
      [class.active]="currentView === 'Week'"
      (click)="changeView('Week')">
      Week
    </button>

    <button
      class="view-btn"
      [class.active]="currentView === 'Month'"
      (click)="changeView('Month')">
      Month
    </button>

  </div>

<div class="timeline-page">

  <!-- 🟦 LEFT SIDEBAR -->
  <div class="sidebar">

    <div class="sidebar-header">
      <h2>Milestones</h2>
      <span class="count">{{ phasesData.length }} Items</span>
    </div>

    <div class="sidebar-list">

      <div class="phase-card" *ngFor="let phase of phasesData">

        <div class="phase-title">
          {{ phase.name }}
        </div>

        <div class="child-list">
          <div class="child-item" *ngFor="let child of phase.children">
            • {{ child.name }}
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- 🟩 RIGHT GANTT -->
  <div class="gantt-section">
    <div class="gantt-wrapper">
      <div #gantt id="gantt" class="gantt-container"></div>
    </div>

  </div>

</div>

</div>
