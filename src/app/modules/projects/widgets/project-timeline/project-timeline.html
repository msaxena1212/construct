<div class="timeline-card">
  <div class="timeline-toolbar">
    <div class="toolbar-left">
      <div class="toolbar-caption">Timeline view</div>
      <button class="view-btn" [class.active]="currentView === 'Day'" (click)="changeView('Day')">Day</button>
      <button class="view-btn" [class.active]="currentView === 'Week'" (click)="changeView('Week')">Week</button>
      <button class="view-btn" [class.active]="currentView === 'Month'" (click)="changeView('Month')">Month</button>
    </div>

    <div class="toolbar-right">
      <div class="summary-pill">
        <span>Tasks</span>
        <strong>{{ ganttRows.length || 0 }}</strong>
      </div>
    </div>
  </div>

  <div class="timeline-table">
    <div class="timeline-table-header" [style.gridTemplateColumns]="gridTemplate">
      <div class="timeline-header-cell timeline-sidebar-header">Task</div>
      <div *ngFor="let column of timelineColumns" class="timeline-header-cell">{{ column.label }}</div>
    </div>

    <div class="timeline-table-body">
      <div *ngFor="let row of ganttRows; trackBy: trackByRow" class="timeline-table-row" [class.child-row]="row.isChild" [style.gridTemplateColumns]="gridTemplate">
        <div class="timeline-sidebar-cell">
          <div class="row-content">
            <div class="row-header">
              <span class="type-badge">{{ row.type | titlecase }}</span>
              <span class="row-color-indicator" [style.background]="row.color"></span>
              <div class="row-label" [style.marginLeft.px]="row.indentLevel * 12">
                {{ row.name }}
                <span class="child-indicator" *ngIf="row.hasChildren">({{ row.childCount }})</span>
              </div>
            </div>
            <div class="row-meta">{{ row.startDate }} • {{ row.endDate }}</div>
          </div>
          <div class="row-progress-bar">
            <div class="progress-fill" [style.width.%]="row.progress"></div>
          </div>
        </div>

        <div *ngFor="let column of timelineColumns" class="timeline-cell"></div>

        <div class="timeline-bar"
          [style.gridColumnStart]="row.startIndex + 2"
          [style.gridColumnEnd]="'span ' + row.span"
          [style.background]="row.color">
          <span>{{ row.name }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
