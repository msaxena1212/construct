<app-common-dialog
  [title]="data.title"
  [badge]="isEditingMilestone ? 'Edit Milestone' : 'Add Milestone'"
  icon="flag"
  [showCloseButton]="true"
  [showFooter]="true"
  cancelLabel="Cancel"
  primaryLabel="Save"
  [primaryDisabled]="form.invalid"
  (cancelled)="dialogRef.close()"
  (primary)="saveMilestone()"
>

   <form [formGroup]="form">

  <div class="p-7">

    <!-- Milestone Name -->
    <div class="mb-5">
      <label class="text-sm font-black block mb-2 text-slate-700 dark:text-slate-200">
        Milestone Name
      </label>

      <input
        type="text"
        formControlName="name"
        placeholder="Enter milestone name"
        class="w-full border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3.5 outline-none bg-white dark:bg-slate-900 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">

      @if(form.get('name')?.invalid && form.get('name')?.touched){
      <div class="text-red-500 text-xs mt-1">
        Name is required
      </div>
      }
    </div>

    <!-- Color -->
    <div class="mb-5">
      <label class="text-sm font-black block mb-2 text-slate-700 dark:text-slate-200">
        Color
      </label>

      <select
        formControlName="color"
        class="w-full border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3.5 outline-none bg-white dark:bg-slate-900 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">

        <option value="blue-600">Blue</option>
        <option value="indigo-600">Indigo</option>
        <option value="emerald-600">Emerald</option>
        <option value="amber-600">Amber</option>
        <option value="rose-600">Rose</option>
        <option value="purple-600">Purple</option>
        <option value="cyan-600">Cyan</option>

      </select>
    </div>

    <!-- Dates -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div>
        <label class="text-sm font-black block mb-2 text-slate-700 dark:text-slate-200">
          Start Date
        </label>

        <input
          [matDatepicker]="startPicker"
          formControlName="startDate"
          (click)="startPicker.open()"
          class="w-full border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3.5 outline-none bg-white dark:bg-slate-900 cursor-pointer focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">

        <mat-datepicker #startPicker></mat-datepicker>
      </div>

      <div>
        <label class="text-sm font-black block mb-2 text-slate-700 dark:text-slate-200">
          End Date
        </label>

        <input
          [matDatepicker]="endPicker"
          formControlName="endDate"
          (click)="endPicker.open()"
          class="w-full border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3.5 outline-none bg-white dark:bg-slate-900 cursor-pointer focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">

        <mat-datepicker #endPicker></mat-datepicker>
      </div>

    </div>

  </div>
  </form>
</app-common-dialog>
