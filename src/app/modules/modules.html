<div class="app-wrapper" [ngClass]="{'sidebar-collapsed': isSidebarCollapsed}">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../../../../assets/image/zyno_construction_logo.png" alt="Logo">
            </div>

            <!-- Toggle Button Inside Sidebar -->
            <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Collapse Sidebar">
                <mat-icon>keyboard_double_arrow_left</mat-icon>
            </button>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li *ngFor="let nav of navData; let i = index">
                    <a class="nav-link" routerLinkActive="activeRoute"
                        [routerLink]="!nav.subMenu ? nav.routevalue : null" (click)="navToggel(i, nav, $event)"
                        [title]="nav.menuitem">

                        <img src="../../../../assets/image/add-new-category.png" class="nav-icon">
                        <span class="nav-text">{{ nav.menuitem }}</span>

                        <i *ngIf="nav.subMenu?.length" class="arrow" [ngClass]="navIndexvalue == i ? 'open' : ''"></i>
                    </a>

                    <ul class="submenu" [ngClass]="navIndexvalue == i ? 'open' : ''">
                        <li *ngFor="let subNav of nav.subMenu; let j = index">
                            <a [routerLink]="subNav.routevalue" routerLinkActive="activeRoute"
                                [title]="subNav.submenuitem">
                                <img src="../../../../assets/image/add-course.png" class="nav-icon">
                                <span class="nav-text">{{ subNav.submenuitem }}</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Area -->
    <div class="main-area">

        <!-- Header -->
        <header class="top-header">
            <!-- Toggle Button in Header (visible when sidebar is collapsed) -->
            <button class="header-toggle-btn" *ngIf="isSidebarCollapsed" (click)="toggleSidebar()" title="Open Sidebar">
                <mat-icon>menu</mat-icon>
            </button>

            <div class="header-left">
                <h3>Welcome Zyno, <span>Delhi</span>!</h3>
                <p>Its {{currentDateTime}}</p>
            </div>

            <div class="header-right">
                <img src="../../../../assets/image/notification-icon.png" class="header-icon">

                <div class="user_profile">
                    <ul>
                        <li (click)="showDropdown($event)">
                            <a class="header-icons"><mat-icon>power_settings_new</mat-icon></a>
                            <div class="dropdown-profile" *ngIf="showList">
                                <a (click)="profile()"><img src="../../../../assets/image/profile-photo.png"
                                        alt="Profile">Profile</a>
                                <a (click)="onLogout()"><img src="../../../../assets/image/profile-photo.png"
                                        alt="Log Out">Log Out</a>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="profile-info">
                    <img src="../../../../assets/image/profile-photo.png" class="profile-img">
                    <div>
                        <h4>Construction Manager</h4>
                        <div class="stars">
                            <img src="../../../../assets/image/star.png" *ngFor="let s of [1,2,3,4,5]">
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content-area">
            <router-outlet></router-outlet>
        </main>

    </div>
</div>
