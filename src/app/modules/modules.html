<div class="app-wrapper" [ngClass]="{'sidebar-collapsed': isSidebarCollapsed}">

  <!-- Sidebar -->
  <aside class="sidebar">
      <div class="sidebar-header">
          <div class="sidebar-logo">
              <img src="../../../../assets/image/zyno_construction_logo.png" alt="Logo">
          </div>

          <!-- Toggle Button Inside Sidebar -->
          <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Collapse Sidebar">
              <mat-icon>keyboard_double_arrow_left</mat-icon>
          </button>
      </div>

      <nav class="sidebar-nav">
          <ul>
              <li *ngFor="let nav of navData; let i = index">
                  <a class="nav-link" routerLinkActive="activeRoute" [routerLink]="!nav.subMenu?.length ? nav.path : null"
                      (click)="navToggel(i, nav, $event)" [title]="nav.name">

                      <mat-icon class="nav-icon-material">{{ nav.icon || 'folder' }}</mat-icon>
                      <span class="nav-text">{{ nav.name }}</span>

                      <i *ngIf="nav.subMenu?.length" class="arrow" [ngClass]="navIndexvalue == i ? 'open' : ''"></i>
                  </a>

                  <ul class="submenu" [ngClass]="navIndexvalue == i ? 'open' : ''">
                      <li *ngFor="let subNav of nav.subMenu; let j = index">
                          <a [routerLink]="subNav.path" routerLinkActive="activeRoute" [title]="subNav.subMenuName">
                              <span class="nav-text" style="padding-left: 20px;">{{ subNav.subMenuName || subNav.name }}</span>
                          </a>
                      </li>
                  </ul>
              </li>
          </ul>
      </nav>
  </aside>

  <!-- Main Area -->
  <div class="main-area">

      <!-- Header -->
      <header class="top-header">
          <!-- Toggle Button in Header (visible when sidebar is collapsed) -->
          <button class="header-toggle-btn" *ngIf="isSidebarCollapsed" (click)="toggleSidebar()" title="Open Sidebar">
              <mat-icon>menu</mat-icon>
          </button>

          <div class="header-left">
              <h3>Welcome {{ currentUser?.firstname || 'Zyno' }} {{ currentUser?.lastname || 'User' }}!</h3>
              <p>Its {{currentDateTime}}</p>
          </div>

          <div class="header-right">
              <img src="../../../../assets/image/notification-icon.png" class="header-icon" alt="Notifications">

              <div class="user_profile">
                  <ul>
                      <li (click)="showDropdown($event)">
                          <a class="header-icons" style="cursor:pointer;"><mat-icon>power_settings_new</mat-icon></a>
                          <div class="dropdown-profile" *ngIf="showList">
                              <a (click)="profile()"><img src="../../../../assets/image/profile-photo.png"
                                      alt="Profile">Profile</a>
                              <a (click)="onLogout()"><img src="../../../../assets/image/profile-photo.png"
                                      alt="Log Out">Log Out</a>
                          </div>
                      </li>
                  </ul>
              </div>

              <div class="profile-info">
                  <img src="../../../../assets/image/profile-photo.png" class="profile-img" alt="User">
                  <div>
                      <h4>{{ currentUser?.roleName || 'Administrator' }}</h4>
                      <div class="stars">
                          <img src="../../../../assets/image/star.png" *ngFor="let s of [1,2,3,4,5]" alt="star">
                      </div>
                  </div>
              </div>
          </div>
      </header>

      <!-- Content -->
      <main class="content-area">
          <router-outlet></router-outlet>
      </main>

  </div>
</div>
