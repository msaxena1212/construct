<div class="bg-slate-50/50 dark:bg-slate-950 min-h-screen animate-in p-4 sm:p-6 lg:p-8">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="text-[10px] font-black uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">
          Project Management • Interactive Schedule
        </span>
      </div>
      <h1 class="text-3xl font-black text-slate-800 dark:text-white">Gantt Timeline</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm">
        Multi-project master schedule, work breakdown milestones, sub-milestones, active site progress, and date dependencies.
      </p>
    </div>

    <!-- Project Filter Dropdown -->
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <div class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-2.5 rounded-2xl shadow-sm">
        <span class="material-symbols-outlined text-slate-400 text-[18px]">domain</span>
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap">Filter Project:</label>
        <select [(ngModel)]="selectedProjectId" (change)="onProjectChange(selectedProjectId)"
          class="bg-transparent text-xs font-black text-slate-800 dark:text-white outline-none cursor-pointer">
          <option value="all">All Projects (Portfolio View)</option>
          <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Interactive Gantt Timeline Widget -->
  <div class="w-full">
    <app-project-timeline [projectId]="selectedProjectId"></app-project-timeline>
  </div>
</div>
