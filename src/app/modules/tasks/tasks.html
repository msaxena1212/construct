<div class="min-h-screen bg-slate-50/50 dark:bg-slate-900/50 p-6">
    <!-- Header Section -->
    <div class="max-w-[1600px] mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
            <h1 class="text-3xl font-black text-slate-800 dark:text-white">Tasks Workspace</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Manage and monitor all construction project tasks
            </p>
        </div>

        <!-- Project Selector -->
        <div
            class="flex items-center gap-4 bg-white dark:bg-slate-800 p-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
            <div class="pl-4 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Project</div>
            <mat-form-field appearance="outline" class="project-select-field min-w-[280px]">
                <mat-select [(ngModel)]="selectedProjectId" (selectionChange)="onProjectChange($event.value)">
                    @for (project of projects; track project.id) {
                    <mat-option [value]="project.id">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full" [class.bg-blue-500]="project.id === selectedProjectId">
                            </div>
                            <span class="font-bold text-slate-700 dark:text-slate-300">{{ project.name }}</span>
                        </div>
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <!-- Task Management Widget -->
    <div class="max-w-[1600px] mx-auto">
        @if (selectedProjectId) {
        <div
            class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-xl sshadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 overflow-hidden min-h-[800px]">
            <app-task-management [projectId]="selectedProjectId" [milestones]="getSelectedProject()?.milestones || []"
                [team_members]="getSelectedProject()?.team_members
                || []"></app-task-management>
        </div>
        } @else {
        <div
            class="flex flex-col items-center justify-center py-40 bg-white dark:bg-slate-800 rounded-[2rem] border-2 border-dashed border-slate-200 dark:border-slate-800">
            <div class="w-20 h-20 bg-slate-50 dark:bg-slate-900 rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-slate-300">folder_open</span>
            </div>
            <h3 class="text-xl font-bold text-slate-900 dark:text-slate-50 mb-2">No Project Selected</h3>
            <p class="text-slate-500 dark:text-slate-400">Please select a project from the dropdown above to view tasks
            </p>
        </div>
        }
    </div>
</div>
