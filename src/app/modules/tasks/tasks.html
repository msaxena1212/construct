<div class="min-h-screen bg-slate-50/50 dark:bg-slate-900/50">
    <div class="w-full mb-4 flex flex-col lg:flex-row lg:items-center justify-between gap-5 px-4 pt-4">
        <div>
            <h1 class="text-3xl font-black text-slate-800 dark:text-white leading-tight">
                Tasks Workspace
            </h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium mt-1">
                Manage and monitor all construction project tasks
            </p>
        </div>
        <div
            class="project-select-wrapper flex items-center gap-4 bg-white dark:bg-slate-800 px-5 py-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 shrink-0">

            <div class="flex flex-col">
                <span class="text-[10px] font-black uppercase tracking-[0.22em] text-slate-400 leading-none mb-1">
                    Project
                </span>
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">
                    Active Workspace
                </span>
            </div>

            <div class="h-10 w-px bg-slate-200 dark:bg-slate-700"></div>

            <mat-form-field appearance="outline" class="project-select-field">
                <mat-select [(ngModel)]="selectedProjectId" (selectionChange)="onProjectChange($event.value)">
                    @for (project of projects; track project.id) {
                    <mat-option [value]="project.id">
                        <div class="flex items-center gap-3">
                            <div class="w-2.5 h-2.5 rounded-full transition-all"
                                [class.bg-blue-500]="project.id === selectedProjectId"
                                [class.bg-slate-300]="project.id !== selectedProjectId">
                            </div>
                            <span class="font-semibold text-slate-700 dark:text-slate-200">
                                {{ project.name }}
                            </span>
                        </div>
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field>

        </div>

    </div>

    <div class="w-full px-4 pb-4">

        @if (selectedProjectId) {

        <div
            class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-xl border border-slate-200/70 dark:border-slate-700 overflow-hidden">
            <div class="p-6">
                <app-task-management [projectId]="selectedProjectId"
                    [milestones]="selectedProject?.milestones ?? emptyMilestones"
                    [team_members]="selectedProject?.team_members ?? emptyTeamMembers">
                </app-task-management>
            </div>
        </div>

        } @else {

        <div
            class="flex flex-col items-center justify-center py-40 bg-white dark:bg-slate-800 rounded-[2rem] border-2 border-dashed border-slate-200 dark:border-slate-700">
            <div class="w-20 h-20 bg-slate-100 dark:bg-slate-900 rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-slate-300">folder_open</span>
            </div>
            <h3 class="text-xl font-bold text-slate-900 dark:text-slate-50 mb-2">No Project Selected</h3>
            <p class="text-slate-500 dark:text-slate-400">Please select a project from the dropdown above to view tasks
            </p>
        </div>

        }

    </div>

</div>
