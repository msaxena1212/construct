<!-- Construction Calendar UI -->
<div class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-orange-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 p-6">

  <!-- Header -->
  <div
    class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5 mb-8">

    <div>
      <h1
        class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">
        Construction Calendar
      </h1>

      <p class="text-slate-500 dark:text-slate-400 mt-1">
        Project schedule, labor planning & site activities
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap gap-3">

      <button
        class="px-5 py-3 rounded-2xl bg-orange-500 hover:bg-orange-600 text-white font-semibold shadow-lg shadow-orange-500/30 transition-all duration-300 hover:-translate-y-1">
        + Add Activity
      </button>

      <button
        class="px-5 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 font-semibold hover:shadow-lg transition-all duration-300">
        Export
      </button>

    </div>

  </div>

  <!-- Calendar Card -->
  <div
    class="bg-white/80 dark:bg-slate-900/90 backdrop-blur-xl rounded-[32px] border border-white/40 dark:border-slate-800 shadow-[0_20px_60px_rgba(0,0,0,0.08)] overflow-hidden">

    <!-- Top -->
  <div
  class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5 p-6 border-b border-slate-200 dark:border-slate-800">

  <!-- Month -->
  <div class="flex items-center gap-4">

    <!-- PREVIOUS -->
    <button
      type="button"
      (click)="previousMonth()"
      class="h-12 w-12 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center hover:bg-orange-50 dark:hover:bg-slate-700 transition-all duration-300 hover:scale-105">

      <span
        class="material-symbols-outlined text-[22px] text-slate-700 dark:text-white">
        chevron_left
      </span>

    </button>

    <!-- MONTH -->
    <div class="min-w-[170px]">

      <h2
        class="text-2xl font-black text-slate-800 dark:text-white">

        {{ months[currentMonth] }} {{ currentYear }}

      </h2>

      <p
        class="text-sm text-slate-500 dark:text-slate-400">
        Site Work Timeline
      </p>

    </div>

    <!-- NEXT -->
    <button
      type="button"
      (click)="nextMonth()"
      class="h-12 w-12 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center hover:bg-orange-50 dark:hover:bg-slate-700 transition-all duration-300 hover:scale-105">

      <span
        class="material-symbols-outlined text-[22px] text-slate-700 dark:text-white">
        chevron_right
      </span>

    </button>

  </div>

  <!-- Legend -->
  <div class="flex flex-wrap items-center gap-4">

    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-orange-500"></div>

      <span class="text-sm text-slate-600 dark:text-slate-300">
        Concrete Work
      </span>
    </div>

    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-blue-500"></div>

      <span class="text-sm text-slate-600 dark:text-slate-300">
        Electrical
      </span>
    </div>

    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500"></div>

      <span class="text-sm text-slate-600 dark:text-slate-300">
        Plumbing
      </span>
    </div>

    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-red-500"></div>

      <span class="text-sm text-slate-600 dark:text-slate-300">
        Deadline
      </span>
    </div>

  </div>

</div>

    <!-- Week Days -->
    <div
      class="grid grid-cols-7 gap-px bg-slate-200 dark:bg-slate-800">

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Sun
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Mon
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Tue
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Wed
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Thu
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Fri
      </div>

      <div
        class="bg-slate-50 dark:bg-slate-900 py-4 text-center text-sm font-bold text-slate-500 dark:text-slate-400">
        Sat
      </div>

    </div>

    <!-- Calendar Grid -->
    <div
      class="grid grid-cols-7 gap-px bg-slate-200 dark:bg-slate-800">

      <!-- Day -->
      <div
        *ngFor="let day of calendarDays"
        class="min-h-[170px] bg-white dark:bg-slate-900 p-3 hover:bg-orange-50/40 dark:hover:bg-slate-800 transition-all duration-300 relative">

        <!-- Date -->
        <div class="flex items-center justify-between mb-3">

          <span
            class="text-sm font-bold text-slate-700 dark:text-slate-200">
            {{ day.date }}
          </span>

          <span
            *ngIf="day.today"
            class="px-2 py-1 text-[10px] rounded-full bg-orange-500 text-white font-bold">
            Today
          </span>

        </div>

        <!-- Events -->
        <div class="space-y-2">

          <!-- Event -->
          <div
            *ngFor="let event of day.events"
            class="p-2 rounded-xl text-xs font-semibold text-white shadow-md truncate"
            [ngClass]="{
              'bg-orange-500': event.type === 'concrete',
              'bg-blue-500': event.type === 'electrical',
              'bg-emerald-500': event.type === 'plumbing',
              'bg-red-500': event.type === 'deadline'
            }">

            {{ event.title }}

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
