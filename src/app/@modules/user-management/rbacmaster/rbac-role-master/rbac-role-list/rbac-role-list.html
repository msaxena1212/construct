<!-- HEADER CARD -->
<div class="header-card">
    <div class="heading_top">
        <div class="page-title">
            <h1>User Management</h1>
            <p class="breadcrumb">
                RBAC
                <span class="breadcrumb-separator">›</span>
                <span>Role List</span>
            </p>
        </div>

        <div class="action-buttons">
            <button class="primary-btn" routerLink="rbac-role-create" *ngIf="assignAction?.Write">
                + Add New Role
            </button>
        </div>
    </div>
</div>

<!-- SEARCH + GRID -->
<div class="right_data_all">
    <div class="searchSelector">
        <div class="example-header">
            <select (change)="onPageSizeChanged()" id="page-size">
                <option value="10" selected>10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
            <span class="pag_size">Per Page</span>
        </div>

        <div class="employee_2">
            <div class="customSearchbar">
                <i class="bi bi-search"></i>
                <input type="text" class="search-input" id="filter-text-box" placeholder="Search....."
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>
    </div>

    <div class="ag_grid">
        <ag-grid-angular 
            class="ag-theme-alpine" 
            style="width:100%; height:500px;" 
            [rowData]="rowData"
            [columnDefs]="columnDefs" 
            [defaultColDef]="defaultColDef" 
            [context]="context"
            [pagination]="true" 
            [paginationPageSize]="10"
            [paginationPageSizeSelector]="[10, 100, 500, 1000]" 
            (gridReady)="onGridReady($event)"
            (cellClicked)="onCellClicked($event)">
        </ag-grid-angular>
    </div>
</div>
