<app-common-dialog [open]="open">
    <div class="flex justify-between items-center px-6 py-4 border-b dark:border-slate-800">
        <h3 class="m-0 text-lg font-semibold text-slate-800 dark:text-slate-100">Invite New Member</h3>
        <button type="button" (click)="closed.emit()"
            class="material-symbols-outlined text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer border-none bg-transparent flex items-center justify-center p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">close</button>
    </div>

    <form [formGroup]="teamForm" (ngSubmit)="inviteUser()">
        <div class="p-6 space-y-5 bg-white dark:bg-slate-900">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 block ml-1">First
                        Name</label>
                    <input type="text" formControlName="firstname" placeholder="John"
                        class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl p-3 text-sm text-slate-900 dark:text-slate-50 font-medium focus:ring-2 focus:ring-blue-500/20 transition-all outline-none">
                    <div *ngIf="teamForm.get('firstname')?.invalid && teamForm.get('firstname')?.touched"
                        class="text-red-500 text-[10px] mt-1 ml-1 font-medium italic">First name is required</div>
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 block ml-1">Last
                        Name</label>
                    <input type="text" formControlName="lastname" placeholder="Doe"
                        class="w-full bg-slate-50 dark:bg-slate-800 boder-none rounded-xl p-3 text-sm text-slate-900 dark:text-slate-50 font-medium focus:ring-2 focus:ring-blue-500/20 transition-all outline-none">
                    <div *ngIf="teamForm.get('lastname')?.invalid && teamForm.get('lastname')?.touched"
                        class="text-red-500 text-[10px] mt-1 ml-1 font-medium italic">Last name is required</div>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 block ml-1">Email
                    Address</label>
                <input type="email" formControlName="email" placeholder="example@zyno.com"
                    class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl p-3 text-sm text-slate-900 dark:text-slate-50 font-medium focus:ring-2 focus:ring-blue-500/20 transition-all outline-none">
                <div *ngIf="teamForm.get('email')?.invalid && teamForm.get('email')?.touched"
                    class="text-red-500 text-[10px] mt-1 ml-1 font-medium italic">Please enter a valid email</div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 block ml-1">Assign
                    Role</label>
                <div class="relative">
                    <button type="button" (click)="toggleRoleDropdown()"
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 pr-8 text-sm text-left font-medium focus:ring-2 focus:ring-blue-500/20 transition-all outline-none flex items-center justify-between"
                        [class.text-slate-400]="!selectedRoleName" [class.text-slate-900]="selectedRoleName"
                        [class.dark:text-slate-50]="selectedRoleName">
                        {{ selectedRoleName || 'Select a role' }}
                        <span class="material-symbols-outlined text-slate-400 text-lg transition-transform"
                            [class.rotate-180]="isRoleDropdownOpen">expand_more</span>
                    </button>

                    <div *ngIf="isRoleDropdownOpen"
                        class="absolute z-10 mt-2 w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden">
                        <div *ngFor="let role of roles" (click)="selectRole(role)"
                            class="px-4 py-3 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer transition-colors">
                            {{ role.name }}
                        </div>
                    </div>
                </div>
                <div *ngIf="teamForm.get('role_id')?.invalid && teamForm.get('role_id')?.touched"
                    class="text-red-500 text-[10px] mt-1 ml-1 font-medium italic">Role assignment is required</div>
            </div>
        </div>

        <div class="px-6 py-4 bg-slate-50 dark:bg-slate-950 flex justify-end gap-3 rounded-b-lg">
            <button type="button" (click)="closed.emit()"
                class="px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all cursor-pointer bg-transparent border-none">
                Cancel
            </button>
            <button type="submit" [disabled]="teamForm.invalid"
                class="px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition-all cursor-pointer shadow-lg shadow-blue-500/20 border-none disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">send</span>
                Send Invite
            </button>
        </div>
    </form>
</app-common-dialog>
